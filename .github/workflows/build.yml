name: Java CI with Maven

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # NOTE: nms1212/ 只有一個 .iml (IDE 殘留),沒有 pom.xml，
      # 也沒有被列進根目錄 pom.xml 的 <modules>，
      # Maven reactor 不會處理它，這裡不需要、也不能對它跑 paper-nms:init。

      - name: Initialize Paper NMS 1.20.2
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1202
      - name: Initialize Paper NMS 1.20.4
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1204
      - name: Initialize Paper NMS 1.20.6
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1206
      - name: Initialize Paper NMS 1.21
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms121
      - name: Initialize Paper NMS 1.21.1
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1211
      - name: Initialize Paper NMS 1.21.3
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1213
      - name: Initialize Paper NMS 1.21.4
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1214
      - name: Initialize Paper NMS 1.21.5
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1215
      - name: Initialize Paper NMS 1.21.6
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1216
      - name: Initialize Paper NMS 1.21.7
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1217
      - name: Initialize Paper NMS 1.21.8
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1218
      - name: Initialize Paper NMS 1.21.9
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms1219
      - name: Initialize Paper NMS 1.21.10
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms12110
      - name: Initialize Paper NMS 1.21.11
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms12111

      # nms2612 / nms262 對應較新的 Paper 版本，其 remap 工具鏈需要 JDK 25。
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Initialize Paper NMS 26.1.2
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms2612
      - name: Initialize Paper NMS 26.2
        run: mvn -B paper-nms:init -f pom.xml
        working-directory: ./nms262

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PoaSK-folia
          path: Main/target/Poa*.jar
          if-no-files-found: error
